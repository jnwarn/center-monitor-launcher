<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Center Monitor HEAD Persistence Test</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #fff7fa;
      color: #191919;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 30rem; padding: 2rem; text-align: center; }
    a { color: #191919; font-weight: 700; }
  </style>
  <script>
    const destination =
      "https://script.google.com/macros/s/AKfycbzmgqhHY1uNiDEZPwmw6zBBim37MGuTQ3mDCdRFzI8/dev";
    const sessionStorageKey =
      "kumonCenterMonitorHeadPersistenceTestSignedSession";
    const fragment = new URLSearchParams(window.location.hash.slice(1));
    const callbackSession = fragment.get("monitor-session");
    const installation = fragment.get("installation");
    const clearSession = fragment.has("clear-monitor-session");

    function readStoredSession() {
      try { return window.localStorage.getItem(sessionStorageKey) || ""; }
      catch (error) { return ""; }
    }

    function storeSession(sessionToken) {
      try { window.localStorage.setItem(sessionStorageKey, sessionToken); }
      catch (error) {}
    }

    function removeStoredSession() {
      try { window.localStorage.removeItem(sessionStorageKey); }
      catch (error) {}
    }

    function monitorDestination(sessionToken) {
      return destination + "?launch=head-test&session=" +
        encodeURIComponent(sessionToken);
    }

    if (callbackSession) {
      storeSession(callbackSession);
      window.history.replaceState(null, "", window.location.pathname);
      window.location.replace(monitorDestination(callbackSession));
    } else if (installation) {
      window.history.replaceState(null, "", window.location.pathname);
      window.location.replace(
        destination + "?headPersistenceTest=1&installation=" +
        encodeURIComponent(installation)
      );
    } else if (clearSession) {
      removeStoredSession();
      window.history.replaceState(null, "", window.location.pathname);
    } else {
      const storedSession = readStoredSession();
      if (storedSession) {
        window.location.replace(monitorDestination(storedSession));
      }
    }
  </script>
</head>
<body>
  <main>
    <h1>Center Monitor HEAD Persistence Test</h1>
    <p id="status">No test session is stored in this browser.</p>
    <p>This temporary page does not use or modify production launcher storage.</p>
  </main>
</body>
</html>
